# Lädst du eine .zip ins Repo hoch (GitHub-Weboberfläche: Add file → Upload files),
# entpackt dieser Workflow sie an Ort und Stelle, committet den Inhalt und löscht die ZIP.
# Enthält die ZIP genau einen Oberordner (z. B. "ha-garage/"), wird dessen Inhalt genommen.
# Der Ordner .github wird nie aus einer ZIP übernommen (GitHub erlaubt das dem Workflow nicht).
name: ZIP entpacken

on:
  push:
    paths:
      - "**.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zip-entpacken
  cancel-in-progress: false

jobs:
  entpacken:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: ZIP-Dateien entpacken
        id: unpack
        run: |
          set -euo pipefail
          mapfile -t zips < <(git ls-files '*.zip')
          if [ ${#zips[@]} -eq 0 ]; then
            echo "Keine ZIP-Datei im Repo gefunden."
            echo "names=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          names=()
          for z in "${zips[@]}"; do
            echo "::group::$z"
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            find "$tmp" -name .DS_Store -delete

            # genau ein Oberordner? → dessen Inhalt verwenden
            src="$tmp"
            mapfile -t top < <(find "$tmp" -mindepth 1 -maxdepth 1)
            if [ ${#top[@]} -eq 1 ] && [ -d "${top[0]}" ]; then
              src="${top[0]}"
            fi

            dest="$(dirname "$z")"
            rsync -a --exclude '.git/' --exclude '.github/' "$src"/ "$dest"/
            git rm -q "$z"
            rm -rf "$tmp"
            names+=("$(basename "$z")")
            echo "Entpackt nach: $dest"
            echo "::endgroup::"
          done
          echo "names=${names[*]}" >> "$GITHUB_OUTPUT"

      - name: Änderungen committen
        if: steps.unpack.outputs.names != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "ZIP entpackt: ${{ steps.unpack.outputs.names }}"
          git push
          {
            echo "### ZIP entpackt"
            echo ""
            echo "${{ steps.unpack.outputs.names }}"
            echo ""
            echo '```'
            git show --stat --format= HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
