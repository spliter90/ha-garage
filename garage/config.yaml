name: Garage
version: "0.3.0"
slug: garage
description: Tankbuch, Verbrauch und Wartung für Autos, Anhänger und Wohnwagen
url: https://github.com/spliter90/ha-garage
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:car-wrench
panel_title: Garage
homeassistant_api: true
options:
  warn_km: 1000
  warn_tage: 30
  publish_interval: 120
schema:
  warn_km: int(0,)
  warn_tage: int(0,)
  publish_interval: int(30,3600)
  api_token: password?
